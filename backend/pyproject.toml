[project]
name = "gridbricks-wind-backend"
version = "0.1.0"
description = "UK Day-Ahead Wind Forecast & Procurement Decision Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.0",
    "requests>=2.34.0",
    "pandas>=3.1.0",
    "python-dateutil>=3.0.0",
    "httpx>=0.28.0",
    "pytest>=9.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]
